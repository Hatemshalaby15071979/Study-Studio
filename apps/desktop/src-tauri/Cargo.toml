[package]
name = "study-studio"
version = "0.2.1"
description = "Study Studio - Zero-setup offline educational content generator"
authors = ["Hatem Shalaby"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "study_studio_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
# OS credential store: Secret Service (Linux), Keychain (macOS), Credential
# Manager (Windows). Keeps provider API keys out of web storage entirely
# (audit N-S-1). Platform backends are explicit: no silent no-op build.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
