# Secret scanning.
#
# Two scans, because they answer different questions:
#
#   - the working tree: is a secret in the code as it stands now?
#   - the whole history: was a secret committed and later deleted? A
#     secret in history is still a leaked secret — deleting the file does
#     not un-leak the credential, it only hides it.
#
# The allowlist below covers findings that are not secrets. Each entry
# says why. Nothing that could be a live credential is allowlisted.

name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # So the analysis can be run on demand — before a change reaches main,
  # or to re-run it without waiting for the next push.
  workflow_dispatch:
  schedule:
    # Weekly, because a secret disclosed today may have been committed
    # months ago.
    - cron: "41 4 * * 1"

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: scan the tree and the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not a shallow clone: a secret committed and
          # later deleted is still in the history, and a shallow clone does
          # not contain it.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.28.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The working tree.
      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1

      # The whole history. `fetch-depth: 0` above is what makes this
      # possible; a shallow clone only has the last commit.
      - name: Scan the history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1
