# Keeps the pinned dependency sets current.
#
# The desktop app has two dependency sets that must stay in step: the
# npm lockfile in apps/desktop, and the Rust lockfile in
# apps/desktop/src-tauri. Both are pinned, and a stale pin is a supply
# chain risk as much as a stability one.

version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps): "
    ignore:
      # gtk-rs 0.20 does not yet exist; latest stable is gtk 0.19.0 which
      # requires glib ^0.18. Upstream tauri 2.x pins gtk/glib ^0.18, so no
      # valid bump path exists until gtk-rs ships 0.20 (tracks webkit2gtk
      # rebuild). Advisory GHSA-wrw7-89jp-8q8g is reachable via VariantStrIter,
      # which this repo never calls. Revisit when gtk-rs 0.20 is released.
      - dependency-name: glib

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps): "
