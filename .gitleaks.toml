# Gitleaks configuration for Study Studio.
#
# The default rule set is used unchanged. This file only adds an
# allowlist, and every entry in it is a finding that is NOT a secret.
#
# The rule is simple: an allowlist entry must name a specific file, a
# specific pattern, and say why the pattern cannot be a live credential.
# Nothing that could be a credential is allowlisted, and no entry
# disables a rule for a whole file.
#
# The paths are matched as fragments, not anchored to the repository
# root, because gitleaks reports the absolute path of the file it
# scanned. An anchored pattern would not match, and the build output
# would be reported on every scan.

title = "Study Studio gitleaks configuration"

[extend]
useDefault = true

# Build output.
#
# These are compiled artefacts — webpack caches, the Next.js build
# directory, the Rust target directory. They are gitignored, they are
# regenerated by every build, and they are full of bytes that trip the
# entropy rules by accident (a Next.js preview signing key, a Rust
# metadata file). A secret does not live in a webpack cache: if one had
# been committed, the git history scan would find it, and this is
# exactly the kind of file a secret gets swept into by an accident.
[[allowlists]]
description = "Build output: webpack/Next.js caches, the static export and the Rust target directory"
paths = [
    '''apps/desktop/\.next/''',
    '''apps/desktop/out/''',
    '''apps/desktop/src-tauri/target/''',
    '''apps/desktop/coverage/''',
    '''apps/desktop/node_modules/''',
]

# The frozen sidecar binary.
#
# A PyInstaller one-file bundle is a compiled executable that embeds the
# Python standard library. It is gitignored — the CI job that builds it
# stages it, and the packaging step copies it into the installer. It is
# not source, and it is not in the history.
[[allowlists]]
description = "The frozen helix-core sidecar binary, which is a build artifact and is gitignored"
paths = [
    '''apps/desktop/src-tauri/binaries/''',
]
